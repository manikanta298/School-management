name: PostgreSQL 17 verification

on:
  pull_request:
    branches: [main, integration/school-audit-updates]
  push:
    branches: [main, integration/school-audit-updates]

permissions:
  contents: read

jobs:
  postgres-17:
    name: Migrations and transport concurrency (PostgreSQL 17)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - name: Apply every migration and verify concurrency constraints
        run: npm run test:postgres
        working-directory: backend
        env:
          POSTGRES_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
