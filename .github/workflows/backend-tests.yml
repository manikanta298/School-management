name: Backend tests
on:
  pull_request:
    branches: ['**']
  push:
    branches: [main]
jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: node --test tests/teachers.test.js tests/staff.test.js
        working-directory: backend
